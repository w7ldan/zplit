name: zplit

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zplit-web:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    networks:
      ingress:
        aliases:
          - zplit-web
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0755
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/healthz", { signal: AbortSignal.timeout(4000) }).then(async
          (response) => { const body = await response.json(); process.exit(response.ok && body.status ===
          "ok" && Object.keys(body).length === 1 ? 0 : 1); }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ingress:
    external: true
    name: desktorrent-watch_ingress
