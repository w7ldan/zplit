name: zplit

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zplit-web:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: zplit
      DB_USER: zplit
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      BETTER_AUTH_URL: https://idr.wildan.lol
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
    secrets:
      - postgres_password
      - better_auth_secret
    expose:
      - "3000"
    networks:
      ingress:
        aliases:
          - zplit-web
      database:
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0755
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/healthz", { signal: AbortSignal.timeout(4000) }).then(async
          (response) => { const body = await response.json(); process.exit(response.ok && body.status ===
          "ok" && Object.keys(body).length === 1 ? 0 : 1); }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    environment:
      POSTGRES_DB: zplit
      POSTGRES_USER: zplit
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U zplit -d zplit
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: zplit-migrator:local
    profiles:
      - tools
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: zplit
      DB_USER: zplit
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - database
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=1777
    user: node

  bootstrap-owner:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth-tool
    image: zplit-auth-tool:local
    profiles:
      - tools
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
      - better_auth_secret
      - owner_name
      - owner_email
      - owner_password
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: zplit
      DB_USER: zplit
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      BETTER_AUTH_URL: https://idr.wildan.lol
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      OWNER_NAME_FILE: /run/secrets/owner_name
      OWNER_EMAIL_FILE: /run/secrets/owner_email
      OWNER_PASSWORD_FILE: /run/secrets/owner_password
    networks:
      - database
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=1777
    user: node
    command:
      - ./node_modules/.bin/tsx
      - scripts/bootstrap-owner.ts

secrets:
  postgres_password:
    file: ./secrets/postgres-password
  better_auth_secret:
    file: ./secrets/better-auth-secret
  owner_name:
    file: ./secrets/owner-name
  owner_email:
    file: ./secrets/owner-email
  owner_password:
    file: ./secrets/owner-password

volumes:
  postgres_data:

networks:
  ingress:
    external: true
    name: wildan-edge-zplit
  database:
    internal: true
